global:
  scrape_interval: 5s

scrape_configs:
  - job_name: consumer
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["consumer"]
        type: A
        port: 8081
        refresh_interval: 5s

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]